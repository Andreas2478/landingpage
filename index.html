<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UL Pilotenausbildung (SPL) | Konair</title>

<style>

body {
margin:0;
font-family:Arial, sans-serif;
color:white;
}

/* HERO BACKGROUND */
.hero {
height:100vh;
background:linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.8)),
url('hero.jpg') center/cover no-repeat;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:20px;
}

/* CONTENT */
.hero-content {
max-width:900px;
}

/* LOGO */
.logo {
width:140px;
margin-bottom:20px;
}

/* HEADLINES */
h1 {
font-size:56px;
margin:10px 0;
}

h2 {
font-weight:normal;
letter-spacing:2px;
color:#d4af37;
}

/* GOLD TEXT */
.gold {
color:#d4af37;
font-weight:bold;
}

/* BUTTON */
.btn {
display:inline-block;
margin-top:20px;
padding:16px 30px;
background:#d4af37;
color:black;
text-decoration:none;
font-weight:bold;
border-radius:6px;
}

/* COUNTDOWN */
.countdown {
margin-top:20px;
font-size:22px;
}

/* INFO BOX RIGHT */
.info-box {
position:absolute;
right:40px;
bottom:80px;
background:rgba(0,0,0,0.7);
padding:20px;
border-radius:10px;
width:280px;
}

.info-box div {
margin-bottom:12px;
}

/* FEATURES LEFT */
.features {
position:absolute;
left:40px;
bottom:80px;
background:rgba(0,0,0,0.7);
padding:20px;
border-radius:10px;
width:300px;
}

/* WHATSAPP */
.whatsapp {
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:white;
padding:15px;
border-radius:50%;
font-size:22px;
text-decoration:none;
}

</style>
</head>

<body>

<section class="hero">

<div class="hero-content">

<img src="logo.png" class="logo">

<h2>DEIN TRAUM. DEINE ZUKUNFT.</h2>

<h1>AUSBILDUNG<br>ZUM PILOTEN (SPL)</h1>

<p class="gold">Starte jetzt!</p>

<p>Nächster Kursstart:</p>

<h1 class="gold">18. Mai 2026</h1>

<a href="#kontakt" class="btn">Jetzt anmelden</a>

<div class="countdown" id="countdown"></div>

</div>

<!-- LEFT FEATURES -->
<div class="features">
<div>✔ Professionelle Ausbildung</div>
<div>✔ Viele Flugstunden</div>
<div>✔ SPL Lizenz</div>
</div>

<!-- RIGHT BOX -->
<div class="info-box">
<div><strong>Kursstart:</strong> 18.05.2026</div>
<div><strong>Ort:</strong> Konstanz</div>
<div><strong>Dauer:</strong> flexibel</div>
<div><strong>Preis:</strong> 11.000 €</div>
</div>

</section>

<!-- WHATSAPP -->
<a class="whatsapp" href="https://wa.me/41763730578" target="_blank">💬</a>

<script>

const target = new Date("May 18, 2026 00:00:00").getTime();

setInterval(()=>{
const now = new Date().getTime();
const diff = target - now;

const d = Math.floor(diff/(1000*60*60*24));
const h = Math.floor((diff%(1000*60*60*24))/(1000*60*60));
const m = Math.floor((diff%(1000*60*60))/(1000*60));

document.getElementById("countdown").innerHTML =
"Start in: " + d + " Tage " + h + "h " + m + "min";

},1000);

</script>

</body>
</html>
