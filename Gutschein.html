<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Konair Gutschein</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#f5f7fa;
padding:40px 20px;
}

.wrapper{
max-width:1400px;
margin:auto;
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
align-items:start;
}

.form-box{
background:white;
padding:40px;
border-radius:24px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.form-box h2{
color:#002b5b;
margin-bottom:30px;
}

input, select{
width:100%;
padding:18px;
margin-bottom:18px;
border-radius:14px;
border:2px solid #e5d2a0;
font-size:17px;
box-sizing:border-box;
}

button{
width:100%;
padding:20px;
border:none;
border-radius:14px;
background:#002b5b;
color:white;
font-size:20px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:0.92;
}

.voucher-preview{
position:relative;
}

.voucher-preview img{
width:100%;
border-radius:24px;
box-shadow:0 15px 40px rgba(0,0,0,0.18);
}

.preview-name{
position:absolute;
top:510px;
left:120px;
font-size:30px;
font-weight:bold;
color:#1d2d50;
}

.preview-flight{
position:absolute;
top:650px;
left:120px;
font-size:28px;
font-weight:bold;
color:#1d2d50;
}

.preview-valid{
position:absolute;
top:770px;
left:170px;
font-size:26px;
font-weight:bold;
color:#1d2d50;
}

.info{
margin-top:25px;
text-align:center;
font-weight:bold;
color:#002b5b;
}

@media(max-width:900px){

.wrapper{
grid-template-columns:1fr;
}

.preview-name{
position:absolute;
top:57%;
left:59%;
transform:translate(-50%,-50%);
font-size:22px;
font-weight:bold;
color:#1d2d50;
width:300px;
text-align:center;
}

.preview-flight{
position:absolute;
top:67%;
left:59%;
transform:translate(-50%,-50%);
font-size:20px;
font-weight:bold;
color:#1d2d50;
width:300px;
text-align:center;
}


.preview-valid{
position:absolute;
top:77%;
left:59%;
transform:translate(-50%,-50%);
font-size:18px;
font-weight:bold;
color:#1d2d50;
width:300px;
text-align:center;
}

}

</style>
</head>

<body>

<div class="wrapper">

<div class="form-box">

<h2>🎁 Gutschein personalisieren</h2>

<input type="text" id="vorname" placeholder="Vorname">

<input type="text" id="nachname" placeholder="Nachname">

<input type="text" id="adresse" placeholder="Adresse">

<input type="tel" id="telefon" placeholder="Telefonnummer">

<input type="email" id="email" placeholder="E-Mail">

<select id="flug">
<option>30 Minuten Rundflug</option>
<option>60 Minuten Rundflug</option>
<option>90 Minuten Rundflug</option>
</select>

<button onclick="downloadPDF()">
Gutschein herunterladen
</button>

<div class="info">
✅ Sofort Download<br>
✅ Kopie per E-Mail<br>
✅ Premium Geschenk-Gutschein
</div>

</div>

<div class="voucher-preview" id="voucher">

<img src="gutschein-premium.jpg">

<div class="preview-name" id="previewName"></div>

<div class="preview-flight" id="previewFlight"></div>

<div class="preview-valid">
31.12.2026
</div>

</div>

</div>

<script>

const { jsPDF } = window.jspdf;

function updatePreview(){

const vorname = document.getElementById("vorname").value;
const nachname = document.getElementById("nachname").value;
const flug = document.getElementById("flug").value;

document.getElementById("previewName").innerHTML =
vorname + " " + nachname;

document.getElementById("previewFlight").innerHTML =
flug;

}

document.querySelectorAll("input, select").forEach(el=>{
el.addEventListener("input", updatePreview);
});

function downloadPDF(){

updatePreview();

const doc = new jsPDF("landscape");

doc.html(document.getElementById("voucher"), {

callback:function(doc){

doc.save("Konair-Gutschein.pdf");

}

});

fetch("https://formspree.io/f/mdabarnw",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

vorname:document.getElementById("vorname").value,

nachname:document.getElementById("nachname").value,

adresse:document.getElementById("adresse").value,

telefon:document.getElementById("telefon").value,

email:document.getElementById("email").value,

flug:document.getElementById("flug").value

})

});

}

</script>

</body>
</html>
