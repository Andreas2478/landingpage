<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Konair Gutschein</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:#f5f7fa;
padding:40px 20px;
}

.wrapper{
max-width:1400px;
margin:auto;
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
align-items:center;
}

.form-box{
background:white;
padding:40px;
border-radius:24px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.form-box h2{
color:#002b5b;
margin-bottom:30px;
font-size:32px;
}

input,
select{
width:100%;
padding:18px;
margin-bottom:18px;
border-radius:14px;
border:2px solid #e5d2a0;
font-size:17px;
box-sizing:border-box;
}

.button-row{
display:flex;
gap:15px;
margin-top:10px;
}

button{
flex:1;
padding:20px;
border:none;
border-radius:14px;
background:#002b5b;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
opacity:0.92;
}

.secondary-btn{
background:white;
color:#002b5b;
border:2px solid #d4af37;
}

.info{
margin-top:25px;
text-align:center;
font-weight:bold;
color:#002b5b;
line-height:1.8;
}

.voucher-preview img{
width:100%;
border-radius:24px;
box-shadow:0 15px 40px rgba(0,0,0,0.18);
}

@media(max-width:900px){

.wrapper{
grid-template-columns:1fr;
}

.form-box{
padding:25px;
}

.form-box h2{
font-size:26px;
text-align:center;
}

.button-row{
flex-direction:column;
}

}

</style>
</head>

<body>

<div class="wrapper">

<div class="form-box">

<h2>🎁 Gutschein personalisieren</h2>

<form action="https://formspree.io/f/mdabarnw" method="POST" data-netlify="true">



<input type="text" name="vorname" placeholder="Vorname" required>

<input type="text" name="nachname" placeholder="Nachname" required>

<input type="text" name="adresse" placeholder="Adresse" required>

<input type="tel" name="telefon" placeholder="Telefonnummer" required>

<input type="email" name="email" placeholder="E-Mail" required>

<select name="flug">
<option>30 Minuten Rundflug</option>
<option>60 Minuten Rundflug</option>
<option>90 Minuten Rundflug</option>
</select>

<div class="button-row">

<button type="submit">
📨 Anfrage senden
</button>

<a href="gutschein-premium.jpg" download style="flex:1;">
<button type="button" class="secondary-btn" style="width:100%;">
⬇ Gutschein herunterladen
</button>
</a>

</div>

</form>

<div class="info">
✅ Sofort Download<br>
✅ Kopie per E-Mail<br>
✅ Premium Rundflug Gutschein
</div>

</div>

<div class="voucher-preview">
<img src="gutschein-premium.jpg">
</div>

</div>

</body>
</html>
